    <!-- Typewriter -->
    <script>
        const segments = [{
                text: "META",
                el: "type-left"
            },
            {
                text: "👾",
                el: "type-center"
            },
            {
                text: "VOID",
                el: "type-right"
            }
        ];
        const speed = 150;

        function typeSegment(segIndex, charIndex) {
            if (segIndex >= segments.length) return;
            const seg = segments[segIndex];
            if (charIndex < seg.text.length) {
                document.getElementById(seg.el).innerHTML += seg.text.charAt(charIndex);
                setTimeout(() => typeSegment(segIndex, charIndex + 1), speed);
            } else {
                typeSegment(segIndex + 1, 0);
            }
        }
        window.onload = () => typeSegment(0, 0);
    </script>

    <!-- Nav iframe overlay -->
    <script>
        const overlay = document.getElementById('iframe-overlay');
        const frame = document.getElementById('page-frame');
        const closeBtn = document.getElementById('iframe-close');
        const errorBox = document.getElementById('iframe-error');

        let loadToken = 0;

        async function openPage(src) {
            const myToken = ++loadToken;

            overlay.classList.add('active');
            errorBox.classList.remove('active');
            frame.style.display = 'none';
            frame.src = '';

            if (typeof window.pauseBackground === 'function') {
                window.pauseBackground();
            }

            try {
                const response = await fetch(src);

                if (!response.ok) {
                    throw new Error('Page could not be loaded');
                }

                // Get the actual HTML code from the file
                const html = await response.text();

                if (myToken !== loadToken) return;

                // Create a Blob containing the HTML.
                // This makes the browser interpret the contents as an HTML page.
                const blob = new Blob([html], {
                    type: 'text/html'
                });

                const blobUrl = URL.createObjectURL(blob);

                // Load the interpreted HTML into the iframe
                frame.src = blobUrl;
                frame.style.display = 'block';

                // Clean up the temporary URL when the iframe is closed
                frame.dataset.blobUrl = blobUrl;

            } catch (err) {
                if (myToken !== loadToken) return;

                console.error('Failed to load page:', err);

                frame.style.display = 'none';
                errorBox.classList.add('active');
            }
        }

        function closePage() {
            overlay.classList.remove('active');
            errorBox.classList.remove('active');

            // Clean up Blob URL
            if (frame.dataset.blobUrl) {
                URL.revokeObjectURL(frame.dataset.blobUrl);
                delete frame.dataset.blobUrl;
            }

            frame.src = '';
            frame.style.display = 'none';

            if (typeof window.resumeBackground === 'function') {
                window.resumeBackground();
            }
        }

        document.querySelectorAll('.nav-link[data-src]').forEach(link => {
            link.addEventListener('click', e => {
                e.preventDefault();
                openPage(link.dataset.src);
            });
        });

        closeBtn.addEventListener('click', closePage);

        overlay.addEventListener('click', e => {
            if (e.target === overlay) {
                closePage();
            }
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && overlay.classList.contains('active')) {
                closePage();
            }
        });
    </script>

    <!-- Shifting text -->
    <script>
        const phrases = ["Welcome to META👾VOID. Enjoy!", "MADE BY 2 IDIOTS", "YEH UPDATE!", "Crap forgot the proxy...", "Shattered Realms?"];
        let currentIndex = 0;

        function showPhrase(text) {
            const wrapper = document.querySelector('.shift-text-wrapper');
            const current = document.getElementById('shift-text');
            current.className = 'shift-text leaving';

            const next = document.createElement('div');
            next.className = 'shift-text entering';

            wrapper.appendChild(next);

            setTimeout(() => {
                current.remove();
                next.id = 'shift-text';

        }

        setTimeout(() => {

            el.textContent = phrases[0];
            el.className = 'shift-text entering';
            setTimeout(() => {
                el.className = 'shift-text';
            }, 450);

            setInterval(() => {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * phrases.length);
                } while (newIndex === currentIndex);
                currentIndex = newIndex;
                showPhrase(phrases[currentIndex]);
            }, 4000);
        }, 2200);

    <!-- Black hole canvas -->
    <script>
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        document.body.appendChild(canvas);

        canvas.style.position = 'fixed';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.width = '100vw';
        canvas.style.height = '100vh';
        canvas.style.zIndex = '-1';

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let bhX = canvas.width / 2;
        let bhY = canvas.height / 2;
        const bhRadius = 144;
        const pullStrength = 0.10;

        class Star {
            constructor() {
                this.reset(true);
            }
            reset(initial = false) {
                if (initial) {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                } else {
                    const edge = Math.floor(Math.random() * 4);
                    if (edge === 0) {
                        this.x = Math.random() * canvas.width;
                        this.y = 0;
                    } else if (edge === 1) {
                        this.x = canvas.width;
                        this.y = Math.random() * canvas.height;
                    } else if (edge === 2) {
                        this.x = Math.random() * canvas.width;
                        this.y = canvas.height;
                    } else {
                        this.x = 0;
                        this.y = Math.random() * canvas.height;
                    }
                }
                this.size = Math.random() * 2 + 2.5;
                this.baseSize = this.size;
                const dx = bhX - this.x;
                const dy = bhY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const tangentStrength = Math.random() * 1.8 + 1.2;
                this.vx = (dy / Math.max(dist, 1)) * tangentStrength;
                this.vy = (-dx / Math.max(dist, 1)) * tangentStrength;
                this.opacity = Math.random() * 0.5 + 0.5;
            }
            update() {
                const dx = bhX - this.x;
                const dy = bhY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const force = pullStrength * (1 + (500 / Math.max(dist, 1)));
                this.vx += (dx / Math.max(dist, 1)) * force;
                this.vy += (dy / Math.max(dist, 1)) * force;
                const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (spd > 18) {
                    this.vx = (this.vx / spd) * 18;
                    this.vy = (this.vy / spd) * 18;
                }
                this.x += this.vx;
                this.y += this.vy;
                const shrinkStart = bhRadius * 4;
                if (dist < shrinkStart) {
                    const t = 1 - dist / shrinkStart;
                    this.size = this.baseSize * (1 - t * 0.92);
                    this.opacity = 1 - t;
                }
                if (dist < bhRadius + 2) this.reset(false);
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0.1, this.size), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const stars = [];
        for (let i = 0; i < 600; i++) stars.push(new Star());

        let glowPulse = 0;
        let holeHistory = [];
        const maxGhosts = 8;
        const ghostInterval = 4;
        let frameCount = 0;
        let rafId = null;
        let bgPaused = false;

        function traceHoleShape(phase) {
            const points = 100;
            const wobbleAmp = bhRadius * 0.02;

            ctx.beginPath();
            for (let i = 0; i <= points; i++) {
                const angle = (i / points) * Math.PI * 2;
                const wobble = Math.sin(angle * 4 - phase * 2) * wobbleAmp +
                    Math.sin(angle * 9 - phase * 1.3) * wobbleAmp * 0.4;
                const r = bhRadius + wobble;
                const x = bhX + Math.cos(angle) * r;
                const y = bhY + Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
        }

        function drawBlackHole() {
            glowPulse += 0.025;
            const pulse = Math.sin(glowPulse) * 0.15 + 0.85;
            const outerGlow = ctx.createRadialGradient(bhX, bhY, bhRadius * 0.5, bhX, bhY, bhRadius * 6 * pulse);
            outerGlow.addColorStop(0, 'rgba(120, 0, 200, 0.25)');
            outerGlow.addColorStop(0.4, 'rgba(80, 0, 160, 0.12)');
            outerGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.beginPath();
            ctx.arc(bhX, bhY, bhRadius * 6 * pulse, 0, Math.PI * 2);
            ctx.fillStyle = outerGlow;
            ctx.fill();

            const innerGlow = ctx.createRadialGradient(bhX, bhY, bhRadius * 0.8, bhX, bhY, bhRadius * 2.8 * pulse);
            innerGlow.addColorStop(0, 'rgba(180, 0, 255, 0.85)');
            innerGlow.addColorStop(0.35, 'rgba(130, 0, 220, 0.45)');
            innerGlow.addColorStop(0.7, 'rgba(80, 0, 160, 0.15)');
            innerGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.beginPath();
            ctx.arc(bhX, bhY, bhRadius * 2.8 * pulse, 0, Math.PI * 2);
            ctx.fillStyle = innerGlow;
            ctx.fill();

            const holeGrad = ctx.createRadialGradient(bhX, bhY, 0, bhX, bhY, bhRadius);
            holeGrad.addColorStop(0, 'rgba(0,0,0,1)');
            holeGrad.addColorStop(0.75, 'rgba(0,0,0,1)');
            holeGrad.addColorStop(1, 'rgba(20,0,40,0.9)');
            traceHoleShape(glowPulse);
            ctx.fillStyle = holeGrad;
            ctx.fill();
        }

        function drawHoleGhosts() {
            for (let idx = 0; idx < holeHistory.length; idx++) {
                const opacity = ((idx + 1) / holeHistory.length) * 0.18; // oldest = faintest
                traceHoleShape(holeHistory[idx]);
                ctx.strokeStyle = `rgba(255, 255, 255, ${opacity.toFixed(3)})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        }

        function drawAccretionDisk() {
            ctx.save();
            ctx.translate(bhX, bhY);
            ctx.scale(1, 0.3);

            const points = 120;
            const outerBase = bhRadius * 4.2;
            const innerBase = bhRadius * 1.05;

            ctx.beginPath();
            // wobbly outer edge
            for (let i = 0; i <= points; i++) {
                const angle = (i / points) * Math.PI * 2;
                const wobble = Math.sin(angle * 3 + glowPulse * 2) * bhRadius * 0.25 +
                    Math.sin(angle * 7 + glowPulse * 1.3) * bhRadius * 0.1;
                const r = outerBase + wobble;
                const x = Math.cos(angle) * r;
                const y = Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            // wobbly inner hole (subtracted)
            for (let i = 0; i <= points; i++) {
                const angle = (i / points) * Math.PI * 2;
                const wobble = Math.sin(angle * 3 + glowPulse * 2) * bhRadius * 0.08;
                const r = innerBase + wobble;
                const x = Math.cos(-angle) * r;
                const y = Math.sin(-angle) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }

            const diskGrad = ctx.createRadialGradient(0, 0, innerBase, 0, 0, outerBase * 1.3);
            diskGrad.addColorStop(0, 'rgba(255, 210, 150, 0.9)');
            diskGrad.addColorStop(0.4, 'rgba(255, 140, 60, 0.5)');
            diskGrad.addColorStop(1, 'rgba(180, 0, 255, 0)');

            ctx.fillStyle = diskGrad;
            ctx.fill('evenodd'); // ← critical: tells canvas to punch the inner path out
            ctx.restore();
        }

        function animate() {
            if (bgPaused) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawAccretionDisk();

            frameCount++;
            if (frameCount % ghostInterval === 0) {
                holeHistory.push(glowPulse);
                if (holeHistory.length > maxGhosts) holeHistory.shift();
            }
            drawBlackHole(); // ← now first
            drawHoleGhosts(); // ← now last, so ghosts sit on top

            stars.forEach(s => {
                s.update();
                s.draw();
            });
            rafId = requestAnimationFrame(animate);
        }
        animate();

        window.pauseBackground = function() {
            bgPaused = true;
            if (rafId) cancelAnimationFrame(rafId);
            canvas.style.display = 'none';
        };

        window.resumeBackground = function() {
            if (!bgPaused) return;
            bgPaused = false;
            canvas.style.display = 'block';
            animate();
        };

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            bhX = canvas.width / 2;
            bhY = canvas.height / 2;
        });
    </script>

</body>
